[build-system]
requires = [
    "setuptools",
    "setuptools_scm>=8",
    "wheel",
    "numpy>=2.0",
    "Cython>=0.25.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "moments/_version.py"

[project]
name = "moments-popgen"
authors = [
    {name = "Aaron Ragsdale", email = "apragsdale@wisc.edu"},
    {name = "Simon Gravel", email = "simon.gravel@mcgill.ca"},
]
license = {text = "MIT"}
requires-python = ">=3.11, <3.16"
dynamic = ["version"]
dependencies=[
    "numpy >=2.0, <3.0",
    "cython >=3.1",
    # Cython newer than 3.1 to allow for code compatible
    # with the free-threaded (GIL-disabled) build
    "scipy >=1.13",
    # scipy 1.13 is the first release compatible with numpy 2
    "mpmath >=1.0, <1.4",
    # mpmath 1.4 introduced many DeprecationWarnings, which turn to errors
    # in our CI. See here: https://github.com/mpmath/mpmath/issues/1015
    "demes >=0.2",
]
readme = "README.md"
description = "Population genetic statistics for evolutionary inference"

[project.urls]
Repository = "https://github.com/MomentsLD/moments"
Documentation = "https://momentsld.github.io/moments/"

[tool.cibuildwheel]
test-requires = "pytest"
test-command = "pytest {project}/tests"
build-frontend = "build"

# Build wheels for all supported stable CPython versions. Free-threaded
# (GIL-disabled, e.g. cp314t, cp315t) builds are skipped.
[tool.cibuildwheel.macos]
build = "cp3{11,12,13,14,15}-*"
skip = "cp3*t-*"

[tool.cibuildwheel.linux]
build = "cp*manylinux*"
archs = "x86_64"
skip = "cp3*t-*"

[tool.pytest.ini_options]
filterwarnings = [
    "error",
]

[tool.black]
# Black only changes its stable style in the first release of each year, so
# require the same major (year) version that CI installs (requirements/lint.txt).
required-version = "26"
